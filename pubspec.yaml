name: taylor
description: Taylor — la primera plataforma de movilidad exclusiva para mujeres.
publish_to: "none"
version: 0.1.0+1

environment:
  # 3.6 es el mínimo real: el tema usa Color.withValues() y CardThemeData,
  # ambos introducidos en Flutter 3.27 / Dart 3.6.
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

# Solo se declara lo que el código importa hoy.
#
# Firebase, ML Kit, cámara y geolocalización añaden dependencias nativas y
# configuración de Gradle/Xcode que ahora mismo no aporta nada, porque esas
# integraciones todavía están simuladas. Están listadas al final del archivo,
# listas para descomentar cuando toque implementarlas.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing + soft transitions
  go_router: ^14.2.0

  # Maps y ubicación
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0

  # Animations
  lottie: ^3.1.2

  # UI helpers
  intl_phone_field: ^3.2.0
  country_flags: ^3.1.0
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  image_picker: ^1.1.2

  # Notificaciones.
  #
  # flutter_local_notifications es la capa de PRESENTACIÓN: canales, prioridad,
  # acciones, sonido. Funciona sin backend, así que el flujo completo se puede
  # demostrar hoy. El TRANSPORTE remoto (FCM) se enchufa después sin tocar
  # nada de esto — ver README → Activar push remoto.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  permission_handler: ^11.3.1

  # Storage / utils
  shared_preferences: ^2.2.3
  intl: any
  uuid: ^4.4.2

# --- Pendientes de integración ------------------------------------------
# Descomentar junto con el código que las use, no antes.
#
#   # Backend (ver README → Configurar Firebase)
#   firebase_core: ^3.3.0
#   firebase_auth: ^5.1.4
#   cloud_firestore: ^5.2.1
#   firebase_storage: ^12.1.3
#
#   # Inicio de sesión social
#   google_sign_in: ^6.2.1
#   sign_in_with_apple: ^6.1.1
#
#   # Geocodificación inversa (coordenada → dirección)
#   geocoding: ^3.0.0
#
#   # Verificación de identidad (documento + rostro)
#   camera: ^0.11.0+2
#   google_mlkit_face_detection: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# Genera los iconos de ambas plataformas desde un solo PNG.
# Regenerar con:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"

  # Android adaptativo: el sistema recorta la capa de primer plano hasta un
  # 66% del lienzo y la anima por separado del fondo. Por eso la 't' del
  # foreground va más pequeña que la del icono completo — si se usara la
  # misma, el gancho inferior quedaría cortado en los launchers circulares.
  adaptive_icon_background: "#FF3E81"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

  # iOS no admite transparencia en el icono de la App Store: rechaza el
  # binario en la subida si el PNG tiene canal alfa.
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/lottie/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
