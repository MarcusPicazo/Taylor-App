# Memoria de la JVM de Gradle.
#
# El template de Flutter trae -Xmx8G -XX:MaxMetaspaceSize=4G, pensado para una
# máquina de 16 GB. En un equipo de ~6 GB eso hace que la JVM pida más memoria
# de la que existe y el daemon muera con "Out of Memory Error" a mitad de
# assembleDebug — un fallo que parece de código pero no lo es.
#
# Estos valores compilan bien en 6 GB. Si desarrollas en una máquina con 16 GB
# o más, súbelos (-Xmx4G) para que la build sea notablemente más rápida.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# En equipos con poca RAM, compilar en paralelo compite por la memoria y acaba
# siendo más lento que hacerlo en serie.
org.gradle.parallel=false
org.gradle.caching=true

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
